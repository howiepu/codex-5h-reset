# CPA 中插件 codex-5h-reset 的配置，不是 CPA 的完整 config.yaml。
enabled: true
model: gpt-5.6-luna
prompt: "HI! Tell me the current time, in YYYY-MM-DD format."
# 开启后每次账号请求生成一道随机算术题，忽略 prompt；默认保留固定发送内容。
random_arithmetic: false
timezone: Asia/Singapore
schedules:
  - id: 早
    at: "05:00"
    enabled: true
  - id: 中
    at: "10:05"
    enabled: true
  - id: 晚
    at: "15:10"
    enabled: true
max_log_entries: 200
history_retention_days: 30
# 令牌刷新独立于模型预热；默认关闭，提前 120 小时（5 天），串行调用 CPA 原生刷新接口。
token_refresh_enabled: false
token_refresh_before_hours: 120
# 复用页面顶部连接；后台连接缓存于 state_file + ".connection.json"（权限 0600）。
# 默认关闭，每轮有失败时按渠道发送一条摘要。地址可能含密钥，请保护 CPA 配置文件。
notify_webhook_url: ""
# 自定义 Webhook；认证直接填写在请求头中。GET 不发送请求体。
notify_webhook_method: POST
notify_webhook_format: json
notify_webhook_headers: {}
notify_webhook_body: |
  {"body": "{{notification}}", "format": "text"}
notify_bark_url: ""
# CPA 容器内的路径；宿主机应持久化挂载 /CLIProxyAPI/plugins。
state_file: /CLIProxyAPI/plugins/data/codex-5h-reset/history.json
