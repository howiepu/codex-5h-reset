name: Check and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go checks
        run: |
          test -z "$(gofmt -l *.go)"
          go test -race ./...
          go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check management page JavaScript
        run: python3 scripts/check_ui.py
      - name: Build and verify native ABI
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          PLUGIN_VERSION=0.1.1
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            PLUGIN_VERSION="${RELEASE_NAME#v}"
          fi
          export PLUGIN_VERSION
          python3 -c 'import os, re; assert re.fullmatch(r"\d+\.\d+\.\d+", os.environ["PLUGIN_VERSION"]), "tag must be vX.Y.Z"'
          mkdir -p dist
          go build -buildmode=c-shared -ldflags "-s -w -X main.version=$PLUGIN_VERSION" -o dist/codex-5h-reset.so .
          python3 scripts/abi_smoke.py dist/codex-5h-reset.so "$PLUGIN_VERSION"
          python3 scripts/ui_server_smoke.py dist/codex-5h-reset.so
          python3 scripts/package.py dist/codex-5h-reset.so "$PLUGIN_VERSION" linux amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/checksums.txt
          cd dist
          sha256sum -c checksums.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes ./*.zip checksums.txt
